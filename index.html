<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16152B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lámpara Bíblica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
html,body{margin:0}img{max-width:100%}
/* Layout: app shell tipo reproductor — barra lateral de navegación (abajo en móvil), escenario central con la tarjeta del versículo como protagonista */
:root{
  --bg:#F2F1F6; --surface:#FFFFFF; --surface-2:#E9E8F0; --line:#DAD8E4;
  --ink:#16152B; --muted:#6B6982; --accent:#B86E00; --accent-ink:#FFFFFF; --accent-soft:#F6E5C8;
  --glow:rgba(184,110,0,.16);
  --ok:#1E8A5A; --ok-soft:#D7EFE3; --mid:#4457D0; --mid-soft:#DFE3FA; --bad:#C2384F; --bad-soft:#F7DCE1; --none:#9A98AE;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-verse:"Instrument Serif", Georgia, "Times New Roman", serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px; --r-lg:22px;
  --shadow:0 1px 2px rgba(22,21,43,.06), 0 8px 24px rgba(22,21,43,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F1C; --surface:#171829; --surface-2:#1F2135; --line:#2B2D45;
  --ink:#EDEBF5; --muted:#9496B2; --accent:#F2B544; --accent-ink:#1A1300; --accent-soft:#3A2E14;
  --glow:rgba(242,181,68,.18);
  --ok:#4CC98E; --ok-soft:#173527; --mid:#8C9DFF; --mid-soft:#232A52; --bad:#FF7A8E; --bad-soft:#3E1C25; --none:#6E7090;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F1C; --surface:#171829; --surface-2:#1F2135; --line:#2B2D45;
  --ink:#EDEBF5; --muted:#9496B2; --accent:#F2B544; --accent-ink:#1A1300; --accent-soft:#3A2E14;
  --glow:rgba(242,181,68,.18);
  --ok:#4CC98E; --ok-soft:#173527; --mid:#8C9DFF; --mid-soft:#232A52; --bad:#FF7A8E; --bad-soft:#3E1C25; --none:#6E7090;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance;font-weight:700;letter-spacing:-.02em}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);box-shadow:0 0 0 6px var(--glow)}
.brand b{font-size:19px;letter-spacing:-.03em}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"] svg{color:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.side-lists{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
.side-lists button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:14px}
.side-lists button:hover{background:var(--surface-2)}
.side-lists button:focus-visible{outline:2px solid var(--accent)}
.side-lists .cover{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}
.side-lists span.n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface-2)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:14px}
.side-foot .who{min-width:0;flex:1}
.side-foot .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who small{font-size:11px;color:var(--muted)}
.icon-btn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.icon-btn:hover{background:var(--surface);color:var(--ink)}
.icon-btn:focus-visible{outline:2px solid var(--accent)}

main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:28px 120px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

.tabbar{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding-block:18px 110px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:10px}
  .tabbar button[aria-current="true"]{color:var(--accent)}
  .mtop{display:flex!important}
}
.mtop{display:none;align-items:center;justify-content:space-between;gap:12px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;transition:transform .12s ease, background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.lg{padding:14px 22px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px var(--glow);transition:transform .12s}
.play:hover{transform:scale(1.05)}
.play.sm{width:40px;height:40px}

/* ---------- Cards / panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.mid{background:var(--mid-soft);color:var(--mid)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.none{background:var(--surface-2);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- Dashboard ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.today{position:relative;overflow:hidden;background:var(--ink);color:var(--bg);border-radius:var(--r-lg);padding:28px;display:flex;flex-direction:column;gap:18px;min-height:250px}
.today::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 65%);opacity:.55;pointer-events:none}
.today .eyebrow{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.today h1{font-size:clamp(28px,4vw,40px);position:relative;z-index:1}
.today h1 em{font-family:var(--f-verse);font-style:italic;font-weight:400;color:var(--accent)}
.today .verse-peek{font-family:var(--f-verse);font-size:19px;line-height:1.4;max-width:46ch;color:color-mix(in srgb,var(--bg) 80%,transparent);position:relative;z-index:1}
.today .row{position:relative;z-index:1;margin-top:auto}
.today .btn:not(.primary){background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
.today .btn:not(.primary):hover{background:color-mix(in srgb,var(--bg) 10%,transparent)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:6px}
.stat .big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat .big small{font-size:18px;font-weight:600;color:var(--muted);margin-left:2px}
.ring-wrap{display:flex;align-items:center;gap:16px}
.flame{color:var(--accent)}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.stackbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.stackbar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.legend div{display:flex;flex-direction:column;gap:2px}
.legend b{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.legend span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}

.vlist{display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 12px;border-radius:12px}
.vrow:hover{background:var(--surface-2)}
.vrow .idx{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.vrow .t{min-width:0}
.vrow .t b{font-weight:700;font-size:15px}
.vrow .t p{font-family:var(--f-verse);font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .acts{display:flex;gap:2px}
.vrow.locked{opacity:.55}
@media (max-width:560px){.vrow{grid-template-columns:minmax(0,1fr) auto;gap:8px}.vrow .idx{display:none}.vrow .chip{grid-column:1;justify-self:start}.vrow .acts{grid-row:1/span 2;grid-column:2}}

/* ---------- Library ---------- */
.lib-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:end}
.cover-xl{width:160px;height:160px;border-radius:18px;display:grid;place-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.cover-xl .glyph{font-family:var(--f-verse);font-size:64px;font-style:italic;line-height:1}
@media (max-width:620px){.lib-head{grid-template-columns:1fr}.cover-xl{width:110px;height:110px}.cover-xl .glyph{font-size:44px}}
.lib-head h1{font-size:clamp(30px,5vw,54px);letter-spacing:-.035em}
.lists-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.lcard{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:12px;transition:transform .15s, box-shadow .15s}
.lcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.lcard:focus-visible{outline:2px solid var(--accent)}
.lcard .cv{aspect-ratio:1;max-width:100%;border-radius:12px;display:grid;place-items:center}
.lcard .cv span{font-family:var(--f-verse);font-style:italic;font-size:48px}
.lcard b{font-size:16px}
.lcard small{color:var(--muted);font-size:13px}
.cv-sug{background:linear-gradient(140deg,#F2B544,#D9792B);color:#2A1500}
.cv-fav{background:linear-gradient(140deg,#8C9DFF,#5B46C9);color:#fff}
.cv-rev{background:linear-gradient(140deg,#4CC98E,#1E7A6C);color:#04241A}
.cv-c1{background:linear-gradient(140deg,#FF9DA9,#C2384F);color:#2B0710}
.cv-c2{background:linear-gradient(140deg,#7FD6E8,#2D7FA6);color:#03202B}
.cv-c3{background:linear-gradient(140deg,#E2C7FF,#8E5BD6);color:#1D0A35}
.cv-c4{background:linear-gradient(140deg,#C9E58A,#5E9431);color:#132104}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.input,.textarea,select.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none;transition:border-color .15s, box-shadow .15s}
.input:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.textarea{min-height:120px;resize:vertical;font-family:var(--f-verse);font-size:19px;line-height:1.45}

/* ---------- Session ---------- */
.stage{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:22px}
.progress{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .35s ease}
.phase-tag{display:flex;gap:8px;flex-wrap:wrap}
.flash{perspective:1600px;cursor:pointer}
.flash-inner{position:relative;min-height:340px;transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);overflow:auto}
.face.front{background:var(--ink);color:var(--bg);border-color:transparent}
.face.front .ref{font-size:clamp(36px,7vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1}
.face.front .hint{color:color-mix(in srgb,var(--bg) 55%,transparent);font-size:13px}
.face.back{transform:rotateY(180deg)}
.verse-text{font-family:var(--f-verse);font-size:clamp(22px,3.4vw,30px);line-height:1.35;text-wrap:pretty}
.ref-line{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}

.q-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow)}
.q-card .ref{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.03em}
.blanks{font-family:var(--f-verse);font-size:clamp(21px,3vw,27px);line-height:2.05}
.blanks input{font-family:var(--f-verse);font-size:inherit;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:0 6px;margin:0 2px;text-align:center;outline:none;max-width:100%}
.blanks input:focus{box-shadow:0 0 0 3px var(--glow)}
.blanks input.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.blanks input.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.blanks .fix{font-family:var(--f-display);font-size:13px;font-weight:700;color:var(--ok);vertical-align:super;margin-right:4px}
.diff{font-family:var(--f-verse);font-size:22px;line-height:1.6}
.diff .ok{color:var(--ok)}
.diff .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.diff .near{color:var(--accent);text-decoration:underline dotted;text-underline-offset:4px;cursor:help}
.diff .near small{font-family:var(--f-display);font-size:12px;color:var(--muted);text-decoration:line-through;margin-left:3px}
.blanks input.near{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.diff .extra{color:var(--muted);text-decoration:line-through}
.result-bar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px}
.result-bar.ok{background:var(--ok-soft);color:var(--ok)}
.result-bar.mid{background:var(--mid-soft);color:var(--mid)}
.result-bar.bad{background:var(--bad-soft);color:var(--bad)}
.result-bar b{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.grade{grid-template-columns:1fr 1fr}}
.grade button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 8px;font-weight:700;display:flex;flex-direction:column;gap:2px;align-items:center}
.grade button small{font-weight:500;color:var(--muted);font-size:11px}
.grade button:hover{border-color:var(--accent)}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink);margin:0 auto;position:relative}
.mic.live{background:var(--bad);color:#fff}
.mic.live::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.q-ref{transition:filter .35s}
.q-ref.masked{filter:blur(12px);user-select:none}
.ref-field{border-top:1px dashed var(--line);padding-top:16px}
.input.ref-ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.input.ref-bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.hidden-verse{font-family:var(--f-verse);font-size:24px;line-height:1.5;filter:blur(9px);user-select:none;transition:filter .4s}
.hidden-verse.shown{filter:none;user-select:auto}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;font-weight:700;font-size:17px;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt[disabled]{pointer-events:none}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lvl{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.lvl.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.lvl b{font-size:16px}.lvl small{color:var(--muted);font-size:12.5px}
@media (max-width:560px){.levels{grid-template-columns:1fr}}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.mode:focus-visible{outline:2px solid var(--accent)}
.mode b{font-size:15px}
.mode small{color:var(--muted);font-size:12.5px;line-height:1.35}

/* ---------- Bienvenida / cuenta ---------- */
.wel{min-height:100%;display:grid;place-items:center;padding-inline:clamp(0px,3vw,32px);padding-block:clamp(0px,4vh,40px)}
.wel-card{width:100%;max-width:1040px;min-height:min(640px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.wel-art{position:relative;background:var(--ink);color:var(--bg);padding:40px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;overflow:hidden}
.wel-art::after{content:"";position:absolute;left:-120px;bottom:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 62%);opacity:.5;pointer-events:none}
.wel-art .big-quote{font-family:var(--f-verse);font-size:clamp(28px,3.2vw,40px);line-height:1.2;position:relative;z-index:1;text-wrap:balance}
.wel-art .big-quote em{color:var(--accent)}
.wel-art .src{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;opacity:.7;position:relative;z-index:1}
.wel-main{padding:40px clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:24px;min-width:0}
.wel-main h1{font-size:clamp(32px,4.4vw,48px);letter-spacing:-.04em;line-height:1}
.wel-main h1 em{font-family:var(--f-verse);font-weight:400;font-style:italic;color:var(--accent)}
.wel-main .lead{font-size:16px;color:var(--muted);max-width:44ch}
.slide-visual{border-radius:20px;background:var(--surface-2);padding:18px;display:flex;flex-direction:column;gap:10px}
.mini-steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini-steps div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.mini-steps b{font-size:14px}.mini-steps small{color:var(--muted);font-size:12px}
.mini-blank{font-family:var(--f-verse);font-size:20px;line-height:1.8}
.mini-blank span{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:4px 4px 0 0;margin:0 3px;height:1.2em;vertical-align:-3px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .25s}
.dots i.on{width:22px;background:var(--accent)}
.wel-actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.wel-actions .btn{width:100%}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-align:center;padding:8px}
.linkbtn:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.form{display:flex;flex-direction:column;gap:14px}
.form .err{color:var(--bad);font-size:13px;font-weight:600;min-height:1.2em}
.pw{position:relative}.pw .input{padding-right:84px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px}
.goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.goal{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.goal[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.goal:focus-visible{outline:2px solid var(--accent)}
.goal b{font-size:20px;font-weight:800;letter-spacing:-.02em}.goal small{color:var(--muted);font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.prev-acc{display:flex;flex-direction:column;gap:6px}
@media (max-width:820px){
  .wel{place-items:stretch;padding:0;background:var(--surface);min-height:100vh;min-height:100dvh}
  .wel-card{grid-template-columns:1fr;border:0;border-radius:0;min-height:100%;box-shadow:none}
  .wel-art{display:none}
  .wel-main{padding:28px 20px calc(24px + env(safe-area-inset-bottom,0px));min-height:100%}
}
/* ---------- Perfil ---------- */
.prof-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prof-head .avatar{width:64px;height:64px;font-size:26px}
.set-group{display:flex;flex-direction:column}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 4px;border-top:1px solid var(--line);flex-wrap:wrap}
.set-row:first-child{border-top:0}
.set-row .lbl{display:flex;flex-direction:column;gap:2px;min-width:0}
.set-row .lbl small{color:var(--muted);font-size:12.5px}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.danger{color:var(--bad)!important}
.side-foot{cursor:pointer}
/* ---------- Login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:40px}
.login-card{width:100%;max-width:520px;display:flex;flex-direction:column;gap:26px}
.login h1{font-size:clamp(40px,8vw,68px);letter-spacing:-.045em;line-height:.95}
.login h1 em{font-family:var(--f-verse);font-weight:400;color:var(--accent)}
.login .quote{font-family:var(--f-verse);font-size:21px;line-height:1.4;color:var(--muted);border-left:2px solid var(--accent);padding-left:14px}
.profiles{display:flex;flex-direction:column;gap:8px}
.profile{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.profile:hover{border-color:var(--accent)}
.profile:focus-visible{outline:2px solid var(--accent)}
.profile .avatar{width:42px;height:42px;font-size:17px}
.profile .meta{flex:1;min-width:0}
.profile .meta b{display:block}
.profile .meta small{color:var(--muted);font-size:12.5px}
.cloud-card{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}

/* ---------- Modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,20,.5);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:tin .25s ease}
@media (min-width:821px){.toast{bottom:28px}}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);cursor:pointer}
.check input{accent-color:var(--accent);width:18px;height:18px}
.empty{padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:17px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9ñ\s]/g," ").replace(/\s+/g," ").trim();
const words = s => norm(s).split(" ").filter(Boolean);
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c;} return p[n]; }
const close = (a,b) => a===b || (b.length>=5 && lev(a,b)<=1);

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
/* Si el navegador bloquea el almacenamiento, se usa memoria mientras la página esté abierta */
const MEM = {};
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); if(v) return JSON.parse(v); }catch(e){} return k in MEM ? JSON.parse(MEM[k]) : d; },
  set(k,v){ const j=JSON.stringify(v); MEM[k]=j; try{ localStorage.setItem(k,j); }catch(e){} }
};

/* =========================================================
   MOTOR DE REPETICIÓN ESPACIADA
   ========================================================= */
function applyResult(id, score){
  const now = Date.now();
  const p = S.progress[id] || { box:0, due:now, reps:0, lapses:0, last:0, introduced:now, hist:[] };
  const wasDue = p.reps===0 || p.due<=now;
  let outcome;
  if(score>=0.9){
    outcome = "ok";
    if(wasDue) p.box = Math.min(5, p.box+1);         // solo sube de nivel si tocaba repasarlo (evita "atiborrarse")
    p.due = now + INTERVAL_DAYS[p.box]*DAY;
  } else if(score>=0.6){
    outcome = "mid";
    p.box = Math.max(1, Math.min(p.box, MASTER-1));  // casi: se queda en proceso
    p.due = now + 0.5*DAY;
  } else {
    outcome = "bad";
    p.lapses++;
    p.box = p.box>=MASTER ? 1 : 0;                   // si era memorizado y falla, regresa a práctica
    p.due = now;
  }
  p.reps++; p.last = now;
  p.hist = (p.hist||[]).concat(Math.round(score*100)).slice(-12);
  S.progress[id] = p;
  const k = todayKey();
  const L = S.log[k] || { n:0, sum:0 };
  L.n++; L.sum += score; S.log[k] = L;
  return outcome;
}
function maybeUnlock(){
  const struggling = activeIds().filter(id=>{ const p=prog(id); return !p || p.box<2; }).length;
  if(struggling < 3 && S.unlocked < SUGGESTED.length){
    const before = S.unlocked;
    S.unlocked = Math.min(SUGGESTED.length, S.unlocked+UNLOCK_STEP);
    return S.unlocked-before;
  }
  return 0;
}
function streak(){
  let d = new Date(); let n = 0;
  if(!S.log[todayKey(d)]) d = new Date(Date.now()-DAY);
  while(S.log[todayKey(d)]){ n++; d = new Date(d.getTime()-DAY); }
  return n;
}
function practicedToday(){ return !!S.log[todayKey()]; }
function accuracy(days=30){
  let n=0,sum=0; for(let i=0;i<days;i++){ const L=S.log[todayKey(new Date(Date.now()-i*DAY))]; if(L){n+=L.n;sum+=L.sum;} }
  return n? Math.round(sum/n*100) : null;
}
/* Elige versículos al azar, con más probabilidad para los de menor nivel,
   los que tocan repaso, los que más fallas y los que no salieron en las últimas sesiones */
function pickWeight(id, now){
  const p = prog(id); const box = p ? p.box : 0;
  let w = 6 - box;                                   // nivel 0 pesa 6, nivel 5 pesa 1
  if(isDue(id,now)) w *= 3;
  if(p && p.lapses) w *= 1 + Math.min(p.lapses,3)*0.3;
  const r = (S.recent||[]).indexOf(id);
  if(r>=0) w *= r < SESSION_SIZE ? 0.15 : 0.45;      // salió hace poco: baja mucho su probabilidad
  return w * (0.6 + Math.random()*0.8);
}
function weightedSample(ids, size, now){
  const pool = ids.slice(); const out = [];
  while(out.length<size && pool.length){
    const ws = pool.map(id=>pickWeight(id,now)); const tot = ws.reduce((a,b)=>a+b,0);
    let r = Math.random()*tot, k = 0;
    while(k<ws.length-1 && (r -= ws[k]) > 0) k++;
    out.push(pool.splice(k,1)[0]);
  }
  return out;
}
function dueIds(ids){ const now=Date.now(); return shuffle(ids.filter(id=>isDue(id,now))); }
let GROWN = 0;
/* Arma cada sesión con versículos distintos a la anterior:
   - los de la sesión pasada descansan (salvo los que fallaste, que vuelven, máximo un tercio)
   - los ya aprendidos se guardan para su repaso programado
   - si no hay suficientes distintos, se agregan versículos sugeridos nuevos */
function buildQueue(ids, {grow=false, size=S.prefs.size}={}){
  const now = Date.now(); GROWN = 0;
  const last = new Set(S.lastIds||[]), failed = new Set(S.lastFailed||[]);
  const avoid = id => last.has(id) && !failed.has(id);
  const resting = id => status(id)==="ok" && !isDue(id,now);
  let fresh = ids.filter(id=>!avoid(id) && !resting(id));
  const want = Math.ceil(size*0.6);
  const need = Math.max(want-fresh.length, size-ids.length);
  if(grow && need>0 && S.unlocked<SUGGESTED.length){
    const before = S.unlocked;
    S.unlocked = Math.min(SUGGESTED.length, S.unlocked + Math.min(10, need));
    const added = SUGGESTED.slice(before, S.unlocked).map(r=>r[0]);
    ids = ids.concat(added); fresh = fresh.concat(added); GROWN = added.length;
  }
  const failedNow = fresh.filter(id=>failed.has(id));
  let pick = weightedSample(failedNow, Math.min(failedNow.length, Math.ceil(size/3)), now);
  const rest = fresh.filter(id=>!pick.includes(id));
  pick = pick.concat(weightedSample(rest.filter(id=>isDue(id,now)), size-pick.length, now));
  if(pick.length<size) pick = pick.concat(weightedSample(rest.filter(id=>!pick.includes(id)), size-pick.length, now));
  if(pick.length<size) pick = pick.concat(weightedSample(ids.filter(id=>!pick.includes(id) && !resting(id)), size-pick.length, now));
  if(pick.length<size) pick = pick.concat(weightedSample(ids.filter(id=>!pick.includes(id)), size-pick.length, now));
  return shuffle(pick);
}
function rememberSession(ids, failed){
  S.lastIds = ids.slice();
  S.lastFailed = failed || [];
  S.recent = ids.concat((S.recent||[]).filter(x=>!ids.includes(x))).slice(0, SESSION_SIZE*3);
}

function activityChart(){
  const days = 14, W=560, H=150, pad={l:26,r:8,t:12,b:24};
  const data = [];
  for(let i=days-1;i>=0;i--){ const d=new Date(Date.now()-i*DAY); const L=S.log[todayKey(d)]; data.push({d, n:L?L.n:0, acc:L?L.sum/L.n:0}); }
  const max = Math.max(4, ...data.map(x=>x.n));
  const step = Math.ceil(max/4); const top = step*4;
  const iw = W-pad.l-pad.r, ih = H-pad.t-pad.b, bw = iw/days;
  const y = v => pad.t + ih - (v/top)*ih;
  let g = "";
  for(let t=0;t<=top;t+=step){ g += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="${t?'2 4':''}"/><text x="${pad.l-6}" y="${y(t)+3}" text-anchor="end">${t}</text>`; }
  const dn = ["D","L","M","M","J","V","S"];
  data.forEach((x,i)=>{
    const h = (x.n/top)*ih, bx = pad.l+i*bw+bw*.18, w = bw*.64;
    const col = x.n ? (x.acc>=.9?"var(--ok)":x.acc>=.6?"var(--mid)":"var(--bad)") : "var(--surface-2)";
    g += `<rect x="${bx}" y="${x.n?y(x.n):y(0)-3}" width="${w}" height="${x.n?h:3}" rx="4" fill="${col}"><title>${todayKey(x.d)}: ${x.n} preguntas${x.n?`, ${Math.round(x.acc*100)}% de acierto`:''}</title></rect>`;

  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* =========================================================
   SESIÓN DE PRÁCTICA
   Fase 1: tarjetas (repaso) · Fase 2: preguntas · Fase 3: resumen

/* Duración de la sesión → cantidad de versículos (≈ 1,6 min por versículo: tarjeta + pregunta + cita) */
const MINUTES = [5,10,15,20,30];
const versesFor = m => Math.max(2, Math.round(m/1.6));
function sessionSize(){ return versesFor(S.prefs.minutes||10); }
function pickFor(source, listId){
  const size = sessionSize();
  if(source==="rev"){
    const ids = activeIds().filter(id=>status(id)==="ok");
    const last = new Set(S.lastIds||[]); const fr = ids.filter(id=>!last.has(id));
    return shuffle(weightedSample(fr.length>=Math.min(size,ids.length)?fr:ids, size, Date.now()));
  }
  if(source==="active") return buildQueue(activeIds(),{grow:true,size});
  if(source==="sug") return buildQueue(activeIds().filter(id=>!S.favs.includes(id)),{grow:true,size});
  const l = getList(listId||source);
  return l ? buildQueue(l.ids,{size}) : [];
}
function startSession(ids, {title, review=false, listId=null}={}){
  if(!ids.length){ toast("No hay versículos para practicar en esta lista."); return; }
  if(GROWN){ toast(`Agregamos ${GROWN} ${GROWN===1?"versículo nuevo":"versículos nuevos"} para variar tu práctica.`); GROWN = 0; }
  SESSION = { ids, source: arguments[1]&&arguments[1].source || ids, title, review, listId, phase:"setup", i:0, mode:S.prefs.mode, results:[], flipped:false, q:null, unlocked:0 };
  VIEW = { name:"session" };
  render();
}
function cardIdsFor(ids){ const failed=new Set(S.lastFailed||[]); return ids.filter(id=>{ const p=prog(id); return !p || p.box<3 || failed.has(id); }); }
function modeFor(id){
  const m = SESSION.mode;
  if(m!=="mixto") return m;
  if(SESSION.modes && SESSION.modes[id]) return SESSION.modes[id];
  const b = (prog(id)||{box:0}).box;
  if(b<=2) return "blanks";
  if(b===3) return "write";
  return Math.random()<.5 ? "write" : "recite";
}
function blankRatio(id){ const b=(prog(id)||{box:0}).box; return [.3,.45,.65,.85,.9,.95][b]; }

/* ---------- Construcción de preguntas ---------- */
/* Las preguntas de cita se mezclan al azar entre las demás, siempre con otras preguntas de por medio */
function buildTasks(ids){
  const tasks = ids.map(id=>({ type:"text", id }));
  shuffle(ids).forEach(id=>{
    const p = tasks.findIndex(x=>x.type==="text" && x.id===id);
    const min = Math.min(tasks.length, p+3);
    const pos = min + Math.floor(Math.random()*(tasks.length-min+1));
    tasks.splice(pos, 0, { type:"ref", id });
  });
  return tasks;
}
function startQuiz(){
  const s = SESSION;
  s.phase = "quiz"; s.tasks = buildTasks(shuffle(s.ids)); s.t = 0; s.pending = {}; s.spoken = {};
  s.modes = {};
  if(s.mode==="mixto"){
    // Reparte los tres tipos en la sesión: espacios para los de menor nivel, escribir en el medio, recitar para los más avanzados (con algo de azar)
    const sorted = s.ids.map(id=>({ id, k:((prog(id)||{box:0}).box) + Math.random()*1.5 })).sort((a,b)=>a.k-b.k).map(x=>x.id);
    const n = sorted.length, base = Math.floor(n/3), rem = n%3;
    const counts = { blanks: base+(rem>0?1:0), write: base+(rem>1?1:0), recite: base };
    let k = 0; ["blanks","write","recite"].forEach(t=>{ for(let c=0;c<counts[t];c++) s.modes[sorted[k++]] = t; });
  }
  prepQuestion();
}
function prepQuestion(){
  const s = SESSION; const task = s.tasks[s.t]; const id = task.id; const v = verse(id);
  if(task.type==="ref"){ s.q = { id, stage:"ref", done:false, spokenRef: s.spoken[id]||"" }; return; }
  const mode = modeFor(id);
  const q = { id, mode, stage:"text", textDone:false, textScore:0, done:false, score:null, transcript:"", spokenRef:"" };
  if(mode==="blanks"){
    const toks = v.text.split(/(\s+)/);
    const cand = [];
    toks.forEach((t,i)=>{ const w=norm(t); if(w && w.length>=3) cand.push(i); });
    const nb = Math.max(1, Math.round(cand.length*blankRatio(id)));
    const pick = new Set(shuffle(cand).slice(0,nb));
    q.toks = toks; q.blanks = [...pick].sort((a,b)=>a-b);
  }
  s.q = q;
}
function refBody(){
  const s = SESSION; const q = s.q; const v = verse(q.id);
  return `
  <div class="spread"><div class="phase-tag"><span class="chip acc">Cita bíblica</span><span class="chip none mono">${s.t+1} / ${s.tasks.length}</span></div></div>
  <div class="q-card">
    <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Identifica la cita</span><h2 style="font-size:clamp(24px,3.6vw,32px)">¿Qué versículo es este?</h2></div>
    <p class="verse-text">“${esc(v.text)}”</p>
    ${q.done?"":`<div class="field"><label for="refBox">Escribe la cita: libro, capítulo y versículo</label><input class="input" id="refBox" placeholder="Libro capítulo:versículo" autocomplete="off" spellcheck="false" maxlength="40" value="${esc(q.spokenRef||"")}"></div>`}
    <div id="feedback"></div>
    ${q.done?"":`<div class="row"><button class="btn ghost" data-act="giveup-ref">No la recuerdo</button><span style="flex:1"></span><button class="btn primary" data-act="check-ref">Comprobar cita</button></div>`}
  </div>`;
}
function quizBody(){
  const s = SESSION; const q = s.q; const v = verse(q.id);
  if(q.stage==="ref") return refBody();
  const fav = S.favs.includes(q.id);
  const modeName = { blanks:"Llenar espacios", write:"Escribir completo", recite:"Recitar" }[q.mode];
  const favBtn = v.sug ? `<button class="btn ${fav?"":"ghost"}" data-act="fav" data-id="${q.id}" style="${fav?'color:var(--accent)':''}">${fav?I.heartF:I.heart} ${fav?"En Mis versículos":"Agregar a Mis versículos"}</button>` : "";
  let inner = "";
  if(q.mode==="blanks"){
    const set = new Set(q.blanks);
    inner = `<div class="blanks">${q.toks.map((t,i)=>{
      if(!set.has(i)) return esc(t);
      const m = t.match(/^([¿¡"«(]*)(.*?)([.,;:!?»")]*)$/) || ["",'',t,''];
      const w = m[2]; const sz = Math.max(3, w.length+1);
      return `${esc(m[1])}<input data-blank="${i}" aria-label="Palabra faltante" autocomplete="off" autocapitalize="off" spellcheck="false" size="${sz}" style="width:${sz*.62}em">${esc(m[3])}`;
    }).join("")}</div><p class="muted" style="font-size:13px">Escribe cada palabra con sus tildes. Una tilde mal puesta cuenta medio punto.</p>`;
  } else if(q.mode==="write"){
    inner = `<textarea class="textarea" id="writeBox" placeholder="Escribe el versículo completo de memoria…" ${q.done?"disabled":""}></textarea>
      <div class="row"><span class="muted" style="font-size:13px">Cuentan las tildes y los signos de puntuación (las mayúsculas no).</span></div>`;
  } else {
    inner = `
      <div style="display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center">
        <button class="mic" id="micBtn" data-act="mic" aria-label="Recitar con micrófono">${I.mic}</button>
        <p class="muted" id="micMsg" style="max-width:46ch">Toca el micrófono y di el versículo de memoria. Si el micrófono no está disponible, recita en voz alta y evalúate tú.</p>
        <p id="transcript" style="font-family:var(--f-verse);font-size:20px;min-height:1.4em"></p>

    ${inner}

}
function afterQuizRender(){
  const q = SESSION.q;
  if(q.stage==="ref"){
    const rb = $("#refBox");
    if(rb){ rb.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); checkRef(); } }); rb.focus(); }
    return;
  }
  if(q.mode==="blanks"){
    const ins = [...root.querySelectorAll("[data-blank]")];
    ins.forEach((el,k)=>{
      el.addEventListener("keydown",e=>{ if(e.key==="Enter"||(e.key===" "&&el.value.trim())){ e.preventDefault(); if(ins[k+1]) ins[k+1].focus(); else checkAnswer(); } });
    });

/* ---------- Cita bíblica ---------- */
function parseRef(s){
  let t = " "+norm(s)+" ";
  t = t.replace(/ (primera|primer|1ra|1a|i) /g," 1 ").replace(/ (segunda|segundo|2da|2a|ii) /g," 2 ").replace(/ (tercera|tercero|3ra|3a|iii) /g," 3 ").trim();
  const nums = t.match(/\d+/g) || [];
  const stop = ["de","del","capitulo","cap","versiculo","versiculos","vers","al","y","v"];
  const book = (t.replace(/\d+/g," ").match(/[a-zñ]+/g)||[]).filter(w=>!stop.includes(w)).join("");
  const lead = /^\d+\s*[a-zñ]/.test(t) ? nums[0] : null;
  return { book, lead, nums: lead ? nums.slice(1) : nums };
}
function refMatch(target, ans){
  const a = parseRef(ans), b = parseRef(target);
  if(a.book.length<2 || !a.nums.length) return false;
  const bookOk = a.book.slice(0,3)===b.book.slice(0,3) || (a.book.length>=2 && b.book.startsWith(a.book));
  return bookOk && (a.lead||"")===(b.lead||"") && a.nums.join(":")===b.nums.join(":");
}

/* ---------- Corrección ---------- */
function lcsAlign(target, answer){
  const n=target.length, m=answer.length;
  const dp = Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j] = close(answer[j],target[i]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<n && j<m){
    if(close(answer[j],target[i])){ ops.push({t:"ok",w:i,a:j}); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ ops.push({t:"miss",w:i}); i++; }
    else { ops.push({t:"extra",a:j}); j++; }
  }
  while(i<n){ ops.push({t:"miss",w:i}); i++; }
  while(j<m){ ops.push({t:"extra",a:j}); j++; }
  return { lcs:dp[0][0], ops };
}
function scoreFreeText(text, attempt){
  const tw = words(text), aw = words(attempt);
  if(!aw.length) return { score:0, html:"" };
  const { lcs, ops } = lcsAlign(tw, aw);
  const score = (2*lcs)/(tw.length+aw.length);
  const disp = text.split(/\s+/);   // palabras originales para mostrar
  const html = ops.map(o=> o.t==="extra" ? `<span class="extra">${esc(attempt.split(/\s+/).filter(x=>norm(x))[o.a]||"")}</span>` : `<span class="${o.t}">${esc(disp[o.w]||"")}</span>`).join(" ");
  return { score, html };
}
/* Escritura estricta: cuentan tildes y signos de puntuación (no las mayúsculas).
   Palabra exacta = 1 punto · misma palabra con tilde o signo distinto = medio punto */
const strictTok = w => String(w).toLowerCase().replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'");
const bareTok = w => strictTok(w).replace(/[^a-záéíóúüñ0-9]/g,"");
function errKind(target, got){
  if(bareTok(target)===bareTok(got)) return "puntuación";
  if(norm(target)===norm(got)) return "tilde";
  return "ortografía";
}
function scoreStrict(text, attempt){
  const tRaw = text.split(/\s+/).filter(Boolean);
  const aRaw = attempt.trim().split(/\s+/).filter(Boolean);
  if(!aRaw.length) return { score:0, html:"", errs:0 };
  const { ops } = lcsAlign(tRaw.map(norm), aRaw.map(norm));
  let credit = 0, errs = 0;
  const html = ops.map(o=>{
    if(o.t==="extra") return `<span class="extra">${esc(aRaw[o.a])}</span>`;
    if(o.t==="miss") return `<span class="miss">${esc(tRaw[o.w])}</span>`;
    const tw = tRaw[o.w], aw = aRaw[o.a];
    if(strictTok(tw)===strictTok(aw)){ credit += 1; return `<span class="ok">${esc(tw)}</span>`; }
    credit += 0.5; errs++;
    return `<span class="near" title="Error de ${errKind(tw,aw)}">${esc(tw)}<small>${esc(aw)}</small></span>`;
  }).join(" ");
  // las operaciones "ok" se alinearon por palabra base; recorrerlas en orden de aparición
  return { score: (2*credit)/(tRaw.length+aRaw.length), html, errs };
}
function feedbackHTML(score){
  const pct = Math.round(score*100);
  const cls = score>=.9?"ok":score>=.6?"mid":"bad";
  const msg = score>=.9?"¡Excelente! Sube de nivel.":score>=.6?"Casi. Lo verás de nuevo pronto.":"Sigue practicando. Vuelve a tu lista de práctica.";
  return `<div class="result-bar ${cls}"><b>${pct}%</b><span>${msg}</span></div>`;
}
/* Parte 1: califica el texto y pasa a la sección de la cita */
function gradeText(score, extraHTML=""){
  const s = SESSION, q = s.q;
  if(q.textDone) return;
  q.textDone = true; q.textScore = score; s.pending[q.id] = score;
  const v = verse(q.id);
  const pct = Math.round(score*100);
  const cls = score>=.9?"ok":score>=.6?"mid":"bad";
  $("#feedback").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
    <div class="result-bar ${cls}"><b>${pct}%</b><span>en el texto. Más adelante te preguntaremos la cita de este versículo.</span></div>${extraHTML}
    ${q.mode!=="recite"?`<p class="muted" style="font-size:13px">Texto correcto:</p><p class="verse-text" style="font-size:20px">${esc(v.text)}</p>`:""}
    <div class="row"><span style="flex:1"></span><button class="btn primary" id="nextQ" data-act="next-q">Siguiente pregunta</button></div></div>`;
  root.querySelectorAll(".q-card > .row").forEach(r=>r.remove());
  const n = $("#nextQ"); if(n) n.focus();
}
/* Parte 2: califica la cita y registra el resultado final */
function checkRef(giveUp=false){
  const q = SESSION.q; if(!q || q.done) return;
  const v = verse(q.id); const rb = $("#refBox");
  if(!giveUp && !rb.value.trim()){ toast("Escribe la cita o toca “No la recuerdo”."); rb.focus(); return; }
  const ok = !giveUp && refMatch(v.ref, rb.value);
  rb.disabled = true; rb.classList.add(ok?"ref-ok":"ref-bad");
  const ts = SESSION.pending[q.id] ?? 0;
  const score = ok ? ts : Math.min(ts*0.85, 0.85);   // sin la cita correcta no sube de nivel
  const refHTML = `<div class="result-bar ${ok?"ok":"bad"}" style="padding:10px 16px"><span>${ok?"Cita correcta:":"La cita correcta es"} <b style="font-size:inherit">${esc(v.ref)}</b>${ok||giveUp?"":` · escribiste “${esc(rb.value.trim())}”`}</span></div>`;
  finalize(score, refHTML);
}
function finalize(score, extraHTML=""){
  const s = SESSION, q = s.q;
  if(q.done) return;
  q.done = true; q.score = score;
  const before = status(q.id);
  const outcome = applyResult(q.id, score);
  s.results.push({ id:q.id, score, outcome, before, after:status(q.id) });
  persist();
  const tsPct = Math.round((s.pending[q.id] ?? 0)*100);
  $("#feedback").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${feedbackHTML(score)}<p class="muted" style="font-size:13px">Resultado final de ${esc(verse(q.id).ref)}: texto ${tsPct}% + cita.</p>${extraHTML}
    <div class="row"><span style="flex:1"></span><button class="btn primary" id="nextQ" data-act="next-q">${s.t<s.tasks.length-1?"Siguiente pregunta":"Ver resultados"}</button></div></div>`;
  root.querySelectorAll(".q-card > .row").forEach(r=>r.remove());
  const n = $("#nextQ"); if(n) n.focus();
}
function checkAnswer(){
  const q = SESSION.q; if(!q || q.textDone) return;
  const v = verse(q.id);
  if(q.mode==="blanks"){
    let ok = 0;
    q.blanks.forEach(i=>{
      const el = root.querySelector(`[data-blank="${i}"]`);
      const exact = el.value.trim() && bareTok(el.value)===bareTok(q.toks[i]);
      const near = !exact && norm(el.value) && close(norm(el.value), norm(q.toks[i]));
      const right = exact;
      ok += exact ? 1 : near ? 0.5 : 0;
      el.classList.add(exact?"right":near?"near":"wrong"); el.disabled = true;
      if(!right){ const fix=document.createElement("span"); fix.className="fix"; fix.textContent=q.toks[i].replace(/[.,;:!?¿¡"«»()]/g,""); el.after(fix); }
    });
    gradeText(ok/q.blanks.length);
  } else if(q.mode==="write"){
    const val = $("#writeBox").value;
    if(!val.trim()){ toast("Escribe el versículo o toca “No lo sé”."); return; }
    const r = scoreStrict(v.text, val);
    $("#writeBox").disabled = true;
    gradeText(r.score, `<div><p class="muted" style="font-size:13px;margin-bottom:4px">Tu respuesta comparada: <span style="color:var(--ok)">correcto</span> · <span style="color:var(--accent)">tilde, signo u ortografía</span> (tu versión tachada al lado) · <span style="color:var(--bad)">faltó</span> · <span style="text-decoration:line-through">sobró</span></p><p class="diff">${r.html}</p>${r.errs?`<p class="muted" style="font-size:13px;margin-top:6px">${r.errs} ${r.errs===1?"palabra tiene":"palabras tienen"} errores de tilde o puntuación (cuentan medio punto).</p>`:""}</div>`);
  }
}

/* ---------- Recitación (voz) ---------- */
let REC = null;
function startMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const msg = $("#micMsg"), btn = $("#micBtn"), tr = $("#transcript");
  if(!SR){ msg.textContent = "Tu navegador no ofrece reconocimiento de voz aquí. Recita en voz alta y luego toca “Mostrar y evaluarme”."; return; }
  if(REC){ try{REC.stop();}catch(e){} return; }
  try{
    REC = new SR(); REC.lang = "es-CO"; REC.continuous = true; REC.interimResults = true;
    let finalText = "";
    REC.onresult = e => { let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalText += r[0].transcript+" "; else interim += r[0].transcript; } SESSION.q.transcript = finalText+interim; tr.textContent = SESSION.q.transcript; };
    REC.onerror = e => { msg.textContent = (e.error==="not-allowed"||e.error==="service-not-allowed") ? "No hay permiso para el micrófono. Permítelo en el navegador (ícono junto a la dirección) o recita en voz alta y toca “Mostrar y evaluarme”." : e.error==="no-speech" ? "No se escuchó nada. Toca el micrófono e inténtalo otra vez." : "No se pudo escuchar bien. Puedes intentarlo de nuevo o evaluarte tú."; };
    REC.onend = () => { btn.classList.remove("live"); REC = null; if(SESSION && SESSION.q && !SESSION.q.done){ { const m=(SESSION.q.transcript||"").match(/((?:primera|segunda|tercera|1|2|3)\s+)?[a-záéíóúñ]+\s+\d+(?:\s*(?::|,|versículo|versiculo|y)?\s*\d+)+\s*$/i); if(m){ SESSION.q.spokenRef=m[0].trim(); SESSION.spoken[SESSION.q.id]=m[0].trim(); } } } if(SESSION && SESSION.q && SESSION.q.transcript.trim()) msg.textContent = "Listo. Toca “Mostrar y evaluarme” para ver tu resultado."; };
    REC.start(); btn.classList.add("live"); msg.textContent = "Escuchando… toca de nuevo para terminar.";
  }catch(e){ REC=null; msg.textContent = "El micrófono no está disponible en esta vista. Recita en voz alta y luego evalúate."; }
}
function reveal(){
  const q = SESSION.q; const v = verse(q.id);
  if(q.textDone) return;
  if(REC){ try{REC.stop();}catch(e){} }
  $("#hv").classList.add("shown");
  if(q.transcript && q.transcript.trim()){
    const tx = q.transcript.replace(/((?:primera|segunda|tercera|1|2|3)\s+)?[a-záéíóúñ]+\s+\d+(?:\s*(?::|,|versículo|versiculo|y)?\s*\d+)+\s*$/i,"");
    const r = scoreFreeText(v.text, tx);
    root.querySelectorAll(".q-card > .row").forEach(r=>r.remove());
    gradeText(r.score, `<div><p class="muted" style="font-size:13px;margin-bottom:4px">Lo que escuchamos comparado con el texto:</p><p class="diff">${r.html}</p></div>`);
    return;
  }
  root.querySelectorAll(".q-card > .row").forEach(r=>r.remove());
  $("#feedback").innerHTML = `<div style="display:flex;flex-direction:column;gap:10px"><p style="font-weight:600">¿Qué tan bien lo recitaste?</p>
    <div class="grade">
      <button data-grade="0.2">No lo recordé<small>Volver a practicar</small></button>
      <button data-grade="0.7">Con errores<small>Varias palabras mal</small></button>
      <button data-grade="0.9">Bien<small>Detalles menores</small></button>
      <button data-grade="1">Perfecto<small>Palabra por palabra</small></button>
    </div></div>`;
}

/* =========================================================
   PRUEBA DE NIVEL (solo al crear un usuario nuevo)
   12 versículos de tres franjas de dificultad:
   llenar espacios (¿lo sabes de memoria?) + elegir la cita (¿conoces la Biblia?)
   ========================================================= */
let PLACE = null;
const LEVELS = [
  { key:"Principiante", min:0,   unlock:5,  desc:"Empiezas con los versículos más conocidos." },
  { key:"Intermedio",   min:.35, unlock:15, desc:"Ya conoces varios; arrancas con un plan más amplio." },
  { key:"Avanzado",     min:.7,  unlock:30, desc:"Tienes buena base; vas directo a pasajes más largos." }
];
function startPlacement(){
  const bands = [[0,20],[20,40],[40,SUGGESTED.length]];
  const items = [];
  bands.forEach(([a,b])=>{
    const ids = shuffle(SUGGESTED.slice(a,b).map(r=>r[0])).slice(0,4);
    const types = shuffle(["blanks","blanks","mc","mc"]);
    shuffle(ids.map((id,k)=>({ id, type:types[k] }))).forEach(x=>items.push(x));
  });
  items.forEach(it=>{
    const v = verse(it.id);
    if(it.type==="blanks"){
      const toks = v.text.split(/(\s+)/); const cand = [];
      toks.forEach((t,i)=>{ if(norm(t).length>=3) cand.push(i); });
      it.toks = toks; it.blanks = shuffle(cand).slice(0, Math.max(2, Math.round(cand.length*.4))).sort((a,b)=>a-b);
    } else {
      const others = shuffle(SUGGESTED.filter(r=>r[0]!==it.id)).slice(0,3).map(r=>r[1]);
      it.opts = shuffle([v.ref, ...others]);
    }
  });
  PLACE = { phase:"intro", i:0, items, scores:[], answered:false };
  VIEW = { name:"placement" }; render(); window.scrollTo({top:0});
}

function placementCheck(){

    if(right) ok++;
    el.classList.add(right?"right":"wrong"); el.disabled = true;
    if(!right){ const f=document.createElement("span"); f.className="fix"; f.textContent=it.toks[i].replace(/[.,;:!?¿¡"«»()]/g,""); el.after(f); }
  });
  const sc = ok/it.blanks.length;
  placementAnswer(sc, `<div class="result-bar ${sc>=.9?"ok":sc>=.6?"mid":"bad"}"><b>${Math.round(sc*100)}%</b><span>${ok} de ${it.blanks.length} palabras</span></div>`);
}
function finishPlacement(){
  const P = PLACE, now = Date.now();
  const avg = P.scores.reduce((a,b)=>a+(b||0),0)/P.items.length;
  const level = LEVELS.slice().reverse().find(l=>avg>=l.min);
  let memo=0, refs=0, known=0, maxIdx=-1;
  P.items.forEach((it,k)=>{
    const sc = P.scores[k]||0; let box = 0;
    if(it.type==="blanks"){ if(sc>=.9){ box=3; memo++; } else if(sc>=.6){ box=1; memo+=.5; } }
    else if(sc>=1){ box=1; refs++; }
    if(box){
      known++; maxIdx = Math.max(maxIdx, SUG_MAP[it.id].order);
      S.progress[it.id] = { box, due: now + INTERVAL_DAYS[box]*DAY, reps:1, lapses:0, last:now, introduced:now, hist:[Math.round(sc*100)] };
    }
  });
  S.unlocked = Math.min(SUGGESTED.length, level.unlock);
  S.extraActive = Object.keys(S.progress).filter(id=>SUG_MAP[id] && SUG_MAP[id].order>=S.unlocked);
  S.placed = { level:level.key, score:Math.round(avg*100), date:todayKey() };
  persist();
  P.result = { avg, level, memo:Math.floor(memo), refs, known };
  P.phase = "done"; render(); window.scrollTo({top:0});
}

let BQ = null;   // sesión de libros o cuestionario
function bookStat(name){ return (S.books||{})[name] || { ok:0, n:0, streak:0 }; }
function bookMastered(name){ return bookStat(name).streak >= 3; }
function divMastery(d){ const b=DIV_MAP[d].books; return Math.round(b.filter(([n])=>bookMastered(n)).length / b.length * 100); }
function scopeBooks(scope){
  if(scope==="AT"||scope==="NT") return BOOKS.filter(b=>b.t===scope);
  if(DIV_MAP[scope]) return BOOKS.filter(b=>b.div===scope);
  return BOOKS;
}
function pickBook(pool){
  const ws = pool.map(b=>{ const s=bookStat(b.name); return (s.streak>=3?1:6-Math.min(s.streak,3)*1.5) * (s.n? 1 : 1.4) * (0.6+Math.random()*0.8); });
  let r = Math.random()*ws.reduce((a,c)=>a+c,0), k=0; while(k<ws.length-1 && (r-=ws[k])>0) k++;
  return pool[k];
}
function nearbyNames(b, excl, n=3){
  const cands = BOOKS.filter(x=>!excl.includes(x.name) && Math.abs(x.i-b.i)<=6).map(x=>x.name);
  const pool = shuffle(cands).slice(0,n);
  while(pool.length<n){ const x=BOOKS[Math.floor(Math.random()*BOOKS.length)].name; if(!excl.includes(x)&&!pool.includes(x)) pool.push(x); }
  return pool;
}
function makeBookQuestion(scope){
  const pool = scopeBooks(scope);
  const b = pickBook(pool);
  const types = ["next","prev","div","gap","chapters","order","next","div"];
  let type = types[Math.floor(Math.random()*types.length)];
  if(type==="next" && b.i===65) type="prev";
  if(type==="prev" && b.i===0) type="next";
  if(type==="gap" && (b.i<1||b.i>64)) type="div";
  const d = DIV_MAP[b.div];
  if(type==="next"){ const a=BOOKS[b.i+1]; return { type, books:[b.name], prompt:`¿Qué libro viene después de <b>${esc(b.name)}</b>?`, answer:a.name, opts:shuffle([a.name, ...nearbyNames(a,[a.name,b.name])]), explain:`Después de ${b.name} viene ${a.name}.` }; }
  if(type==="prev"){ const a=BOOKS[b.i-1]; return { type, books:[b.name], prompt:`¿Qué libro va antes de <b>${esc(b.name)}</b>?`, answer:a.name, opts:shuffle([a.name, ...nearbyNames(a,[a.name,b.name])]), explain:`Antes de ${b.name} está ${a.name}.` }; }
  if(type==="gap"){ const p=BOOKS[b.i-1], n=BOOKS[b.i+1]; return { type, books:[b.name], prompt:`Completa el orden: <b>${esc(p.name)}</b> → <b>___</b> → <b>${esc(n.name)}</b>`, answer:b.name, opts:shuffle([b.name, ...nearbyNames(b,[b.name,p.name,n.name])]), explain:`El orden es ${p.name}, ${b.name}, ${n.name}.` }; }
  if(type==="chapters"){ const wrong=new Set(); while(wrong.size<3){ const delta=[-3,-2,-1,1,2,3,5,-5,10][Math.floor(Math.random()*9)]; const v=b.ch+delta; if(v>0&&v!==b.ch) wrong.add(String(v)); } return { type, books:[b.name], prompt:`¿Cuántos capítulos tiene <b>${esc(b.name)}</b>?`, answer:String(b.ch), opts:shuffle([String(b.ch), ...wrong]), explain:`${b.name} tiene ${b.ch} ${b.ch===1?"capítulo":"capítulos"}.` }; }
  if(type==="order"){
    const start = Math.max(0, Math.min(b.i - Math.floor(Math.random()*3), 61));
    const seq = BOOKS.slice(start, start+5).map(x=>x.name);
    let mixed = shuffle(seq); if(mixed.join()===seq.join()) mixed = shuffle(seq);
    return { type, books:seq, prompt:`Toca los libros <b>en el orden</b> en que aparecen en la Biblia`, answer:seq, opts:mixed, picked:[], explain:`El orden es: ${seq.join(", ")}.` };
  }
  const sameT = DIVS.filter(x=>x.id!==d.id && x.t===d.t).map(x=>x.name);
  const other = DIVS.filter(x=>x.id!==d.id && x.t!==d.t).map(x=>x.name);
  const wrong = shuffle(sameT).slice(0,2).concat(shuffle(other).slice(0,1));
  return { type:"div", books:[b.name], prompt:`¿A qué grupo pertenece <b>${esc(b.name)}</b>?`, answer:d.name, opts:shuffle([d.name, ...wrong]), explain:`${b.name} está en ${d.name} (${T_NAME[d.t]}).` };
}
function makeTriviaSession(n){

  const avg = r.length ? Math.round(r.reduce((a,x)=>a+x.score,0)/r.length*100) : 0;
  const up = r.filter(x=>x.outcome==="ok").length, bad = r.filter(x=>x.outcome==="bad").length;

  return `

    <div class="panel" style="padding:10px"><div class="vlist">${r.map((x,i)=>{ const v=verse(x.id); const cls=x.outcome==="ok"?"ok":x.outcome==="mid"?"mid":"bad"; return `<div class="vrow" style="grid-template-columns:28px minmax(0,1fr) auto auto"><span class="idx">${i+1}</span><div class="t"><b>${esc(v.ref)}</b><p>${esc(v.text)}</p></div><span class="chip ${cls} mono">${Math.round(x.score*100)}%</span><span class="chip ${x.after}">${STATUS_LABEL[x.after]}</span></div>`; }).join("")}</div></div>

}

/* ---------- Voz (lectura en voz alta) ---------- */
function speak(text){
  try{
    if(!("speechSynthesis" in window)){ toast("Tu navegador no puede leer en voz alta."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const vs = speechSynthesis.getVoices();
    const pick = vs.find(v=>/es[-_](CO|MX|US|419)/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang));
    if(pick) u.voice = pick;
    u.lang = pick ? pick.lang : "es-ES"; u.rate = .92;
    speechSynthesis.speak(u);
  }catch(e){ toast("No se pudo reproducir el audio."); }
}
function stopSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} if(REC){ try{REC.stop();}catch(e){} } }

function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className="toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3200);
}
function modal(html, onMount){

}

async function hashPass(pass, salt){
  const txt = salt + "|" + pass;
  try{
    if(!(window.crypto && crypto.subtle)) throw 0;
    const buf = await Promise.race([crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)), new Promise((_,r)=>setTimeout(()=>r(0),1500))]);
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ let h=2166136261; for(const c of txt){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return "f"+(h>>>0).toString(16); }
}

function authError(e){
  const m = String((e && (e.message||e.error_description)) || e || "");
  if(/invalid login/i.test(m)) return "El correo o la contraseña no coinciden.";
  if(/already registered|already exists/i.test(m)) return "Ya existe una cuenta con ese correo. Toca “Ya tengo una cuenta”.";
  if(/not confirmed/i.test(m)) return "Falta confirmar tu correo: abre el enlace que te enviamos y vuelve a intentar.";
  if(/password/i.test(m) && /(weak|short|least|characters)/i.test(m)) return "La contraseña es muy débil. Usa al menos 6 caracteres.";
  if(/rate|too many/i.test(m)) return "Demasiados intentos seguidos. Espera un minuto e inténtalo de nuevo.";
  if(/fetch|network|failed to fetch|load failed/i.test(m)) return "No hay conexión a internet. Revisa tu conexión e inténtalo de nuevo.";
  return "No se pudo completar: " + m;
}

  if(pass.length<6) return formErr("La contraseña debe tener al menos 6 caracteres.");
  if(!$("#suConsent").checked) return formErr("Para crear la cuenta, marca la casilla de autorización de datos.");
  formErr("");
  const { data, error } = await SB.auth.signUp({ email, password: pass, options: { data: { name } } });
  if(error) return formErr(authError(error));
  if(!data.session){ return formErr("Te enviamos un correo para confirmar la cuenta. Ábrelo y luego entra con tu correo y contraseña."); }
  const seed = localSeed(email);
  await cloudEnter(data.user, { name, seed, fresh: !seed });
}
async function cloudLogin(){
  const email=$("#liEmail").value.trim().toLowerCase(), pass=$("#liPass").value;
  if(!validEmail(email)) return formErr("Escribe un correo válido, por ejemplo nombre@correo.com.");
  if(!pass) return formErr("Escribe tu contraseña.");
  formErr("");
  const { data, error } = await SB.auth.signInWithPassword({ email, password: pass });
  if(error){
    let msg = authError(error);
    if(/no coinciden/.test(msg) && accounts().some(a=>a.email===email)) msg += " Si la creaste antes en este dispositivo, toca tu cuenta abajo para pasarla a la nube.";
    return formErr(msg);
  }
  await cloudEnter(data.user, { seed: localSeed(email) });
}
async function cloudEnter(user, { name, seed, fresh } = {}){
  const meta = user.user_metadata || {};
  let row = null; cloudLoaded = false;
  try{ row = await cloudRead(user.id); cloudLoaded = true; }catch(e){}
  const key = "cloud:"+user.id;
  const cached = LS.get("lampara.state."+key, null);
  let state = row && row.state && Object.keys(row.state).length ? row.state : null;
  if(cached && (!state || (cached._savedAt||0) > (state._savedAt||0))) state = cached;
  const seeded = !state && seed;
  if(seeded) state = seed;
  ME = { mode:"cloud", id:user.id, name:(row&&row.name) || name || meta.name || user.email.split("@")[0], email:user.email, color:colorFor(user.id), key };
  S = Object.assign(freshState(), state || {});
  applyTheme(S.prefs.theme);
  WEL = { step:0, migrate:null, goal:S.prefs.minutes||10, err:"" };
  persist(); cloudFlush();
  if(seeded) toast("Tu progreso de este dispositivo ahora está guardado en la nube.");
  if(fresh && !seeded){ WEL.step="goal"; VIEW={name:"welcome-goal"}; renderWelcomeGoal(); }
  else enterApp();
}
async function localSignup(){
  const name=$("#suName").value.trim(), email=$("#suEmail").value.trim().toLowerCase(), pass=$("#suPass").value;
  if(!name) return formErr("Escribe tu nombre.");
  if(!validEmail(email)) return formErr("Escribe un correo válido, por ejemplo nombre@correo.com.");
  if(pass.length<6) return formErr("La contraseña debe tener al menos 6 caracteres.");
  const accs = accounts();
  if(accs.some(a=>a.email===email)) return formErr("Ya hay una cuenta con ese correo en este dispositivo. Toca “Ya tengo una cuenta”.");
  const salt = uid()+uid();
  const acc = { id:"a-"+uid()+uid(), name, email, color:COLORS[accs.length%COLORS.length], salt, hash: await hashPass(pass,salt), created:Date.now() };
  if(WEL.migrate){
    acc.legacy = WEL.migrate;
    const old = LS.get("lampara.state.local:"+WEL.migrate, null);
    if(old) LS.set("lampara.state.acct:"+acc.id, old);
  }
  accs.push(acc); saveAccounts(accs);
  signIn(acc, { fresh: !WEL.migrate });
}
async function localLogin(){
  const email=$("#liEmail").value.trim().toLowerCase(), pass=$("#liPass").value;
  if(!validEmail(email)) return formErr("Escribe un correo válido, por ejemplo nombre@correo.com.");
  const acc = accounts().find(a=>a.email===email);
  if(!acc){
    const box = $("#formErr");
    box.innerHTML = `No hay una cuenta con ese correo en este navegador. En esta versión de prueba, cada cuenta se guarda solo en el celular o navegador donde se creó. <button class="linkbtn" data-act="signup-with" data-email="${esc(email)}" style="padding:4px 0;display:inline">Crear la cuenta aquí con ese correo</button>`;
    return;
  }
  if(await hashPass(pass, acc.salt)!==acc.hash) return formErr("La contraseña no es correcta. Revisa mayúsculas y espacios.");
  signIn(acc, {});
}
function signIn(acc, {fresh}){
  ME = { mode:"account", id:acc.id, name:acc.name, email:acc.email, color:acc.color, key:"acct:"+acc.id };
  S = Object.assign(freshState(), LS.get("lampara.state."+ME.key, {}));
  LS.set("lampara.session", acc.id);
  applyTheme(S.prefs.theme);
  WEL = { step:0, migrate:null, goal:S.prefs.minutes||10, err:"" };
  persist();
  if(fresh){ WEL.step="goal"; VIEW={name:"welcome-goal"}; renderWelcomeGoal(); }
  else enterApp();
}
function renderWelcomeGoal(){ const keep=ME; ME=null; renderWelcome(); ME=keep; }
async function signOut(){
  stopSpeech();
  if(ME && ME.mode==="cloud" && SB){ try{ await cloudFlush(); }catch(e){} try{ await SB.auth.signOut(); }catch(e){} }
  localSignOut();
}
function localSignOut(){ LS.set("lampara.session", null); ME=null; S=null; SESSION=null; PLACE=null; WEL={ step:"login", goal:10, err:"" }; applyTheme(null); VIEW={name:"home"}; render(); }
async function deleteAccount(){
  if(ME.mode==="cloud" && SB){
    const { error } = await SB.rpc("delete_my_account");
    if(error){ toast("No se pudo eliminar la cuenta: " + authError(error)); return; }
    const key = ME.key; delete MEM["lampara.state."+key]; try{ localStorage.removeItem("lampara.state."+key); }catch(e){}
    try{ await SB.auth.signOut(); }catch(e){}
    localSignOut(); WEL.step=0; render(); toast("Tu cuenta y todo su progreso se eliminaron.");
    return;
  }
  const id = ME.id;
  saveAccounts(accounts().filter(a=>a.id!==id));
  delete MEM["lampara.state.acct:"+id]; try{ localStorage.removeItem("lampara.state.acct:"+id); }catch(e){}
  localSignOut(); WEL.step=0; render(); toast("Tu cuenta y su progreso se eliminaron de este dispositivo.");
}
function needsPlacement(){ return !S.placed && Object.keys(S.progress).length===0; }
function enterApp(){ if(needsPlacement()) startPlacement(); else go("home"); }

  <section class="panel">
    <h3 style="margin-bottom:6px">Cuenta</h3>

      <div class="set-row"><div class="lbl"><b>Dónde se guarda tu progreso</b><small>${ME.mode==="cloud"?`En la nube${cloudLastSync?` · última copia ${cloudLastSync.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}`:""}. Puedes entrar desde cualquier dispositivo.`:"Solo en este dispositivo."}</small></div><span class="chip ${ME.mode==="cloud"?"ok":"none"}">${ME.mode==="cloud"?"Nube":"Local"}</span></div>
      <div class="set-row"><div class="lbl"><b>Cerrar sesión</b><small>Tu progreso queda guardado en esta cuenta</small></div><button class="btn" data-act="logout">${I.logout} Cerrar sesión</button></div>
      <div class="set-row"><div class="lbl"><b>Eliminar cuenta</b><small>Borra la cuenta y todo su progreso. No se puede deshacer.</small></div><button class="btn danger" data-act="delete-account">${I.trash} Eliminar cuenta</button></div>
